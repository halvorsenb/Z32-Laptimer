<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Z32 Track Dash</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04070b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070b;--pn:#0b121b;--bd:#27374b;--fg:#e6edf5;--mut:#8798ae;--g:#2be36f;--r:#ff3d4d;--a:#ffb21f;--b:#4d8dff;
 --gap:clamp(4px,1.3vmin,9px);--bh:clamp(38px,8vmin,52px);--rh:clamp(22px,6.2vmin,30px);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;overflow:hidden;overscroll-behavior:none}
html{height:100dvh}
body{height:100dvh;display:flex;flex-direction:column;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
 padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
[hidden]{display:none!important}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}.dim{color:var(--mut)}

/* header */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:clamp(3px,1vmin,8px) clamp(8px,2.4vmin,14px);font-size:clamp(11px,3vmin,14px);color:var(--mut);min-height:clamp(26px,6vmin,36px)}
.top #stL{white-space:nowrap}
.top #stR{margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--r)}.dot.live{background:var(--g)}
button{font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
button:active{background:#142030}
button:focus-visible{outline:2px solid var(--a)}
.top button{min-height:0;padding:0 10px;line-height:1.5;font-size:1.3em}

/* grid */
.grid{flex:1;min-height:0;display:grid;gap:var(--gap);padding:0 var(--gap) var(--gap);
 grid-template-columns:minmax(0,1fr) minmax(0,1fr);
 grid-template-rows:minmax(0,1.1fr) minmax(0,4.6fr) minmax(0,1.9fr) minmax(0,3fr) minmax(0,1.5fr);
 grid-template-areas:"last best" "tires tires" "fuel fuel" "laps laps" "gg gg"}
.a-last{grid-area:last}.a-best{grid-area:best}.a-tires{grid-area:tires}.a-fuel{grid-area:fuel}.a-laps{grid-area:laps}.a-gg{grid-area:gg}
@media(orientation:landscape){
 :root{--bh:clamp(34px,9vmin,46px);--rh:clamp(19px,6vmin,26px)}
 .grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1.35fr) minmax(0,1.1fr);
  grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,1.55fr);
  grid-template-areas:"last tires fuel" "best tires fuel" "laps tires gg"}
}

/* sections & cards */
.sec{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(2px,.7vmin,5px)}
.sl{flex:none;font-size:clamp(10px,2.8vmin,13px);color:var(--mut);letter-spacing:.05em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.k{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:clamp(4px,1.2vmin,9px) clamp(7px,1.8vmin,13px);min-width:0;min-height:0;container-type:size;display:flex;flex-direction:column;justify-content:center;gap:clamp(0px,.4vmin,3px);overflow:hidden}
.sec>.k,.sec>.fg,.sec>.tg{flex:1}
.kl{font-size:clamp(10px,2.7vmin,14px);color:var(--mut);letter-spacing:.04em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kv{line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums}
.kt{font-size:7vmin;font-size:min(17.5cqw,48cqh)}
.kf{font-size:5vmin;font-size:min(14cqw,40cqh)}
.kg{font-size:5vmin;font-size:min(13cqw,36cqh)}
.k.flash{background:#3a2a05;border-color:var(--a)}
.k.off{opacity:.4;filter:grayscale(1)}

/* tires */
.tg{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:var(--gap)}
.tb{container-type:size;min-height:0;min-width:0;border:3px solid;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tb .kl{color:var(--fg);font-size:clamp(10px,min(8cqw,14cqh),16px)}
.tb b{font-weight:400;font-size:9vmin;font-size:min(27cqw,42cqh);line-height:1.05;font-variant-numeric:tabular-nums}
.tb.ok{border-color:#e6edf5;background:#161f2b}
.tb.cold{border-color:var(--b);background:#0b1a33}
.tb.hot{border-color:var(--r);background:#2a0b10}
.tb.na{border-color:var(--bd);background:var(--pn);opacity:.5}
.lg{flex:none;display:flex;justify-content:space-between;font-size:clamp(10px,2.7vmin,13px);color:var(--mut);padding:0 2px}
.lg i{display:inline-block;width:.85em;height:.85em;border:2px solid;border-radius:2px;margin-right:.4em;vertical-align:-.1em}

/* fuel */
.fg{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap)}
@media(orientation:landscape){.fg{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}}
#kFuel{cursor:pointer}

/* laps */
.laps{justify-content:flex-start;padding-top:2px;padding-bottom:2px}
#kLaps{flex:1;min-height:0;overflow:hidden}
.lr{display:grid;grid-template-columns:2.3em minmax(0,1fr) auto;align-items:center;height:var(--rh);font-size:clamp(12px,3.5vmin,17px);border-top:1px solid var(--bd);white-space:nowrap;font-variant-numeric:tabular-nums}
.lr:first-child{border-top:none}
.lr .lap{font-size:.8em}
.lapnote{white-space:normal;padding-top:6px;font-size:clamp(11px,3vmin,14px)}

/* lat g */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.kb{position:relative;height:clamp(8px,2.4vmin,14px);background:#161f2b;flex:none;margin:clamp(2px,.7vmin,5px) 0}
.kb i{position:absolute;top:0;bottom:0;background:var(--c,#cfd9e6)}
.kb u{position:absolute;left:50%;top:-25%;bottom:-25%;width:2px;background:var(--mut)}

/* buttons */
.bar2{flex:none;display:flex;gap:var(--gap);padding:0 var(--gap) var(--gap)}
.bar2 button{flex:1;min-height:var(--bh);font-size:clamp(13px,3.3vmin,17px);border-radius:8px}
.menu{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sheet{background:var(--pn);border:1px solid var(--bd);border-radius:12px 12px 0 0;padding:10px;width:min(100%,560px);max-height:100%;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sheet button{min-height:var(--bh);font-size:clamp(13px,3.2vmin,17px);padding:4px 6px}
.sheet .full{grid-column:1/-1}
.sheet .p2{background:var(--g);color:#06140b;border-color:var(--g)}
@media(orientation:landscape){.menu{align-items:center}.sheet{border-radius:12px;grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>

<header class="top"><i class="dot" id="dot"></i><span id="stL">No source</span><span id="stR"></span><button id="bMenu" aria-label="Menu">⋮</button></header>

<main class="grid" id="grid">
 <div class="k a-last"><div class="kl" id="pLastL">LAST LAP</div><div class="kv kt" id="pLast">–:––.––</div></div>
 <div class="k a-best"><div class="kl" id="pBestL">BEST LAP</div><div class="kv kt g" id="pBest">–:––.––</div></div>

 <section class="sec a-tires">
  <div class="sl">TIRE PSI · BOX COLOR = BRAKE TEMP</div>
  <div class="tg">
   <div class="tb na" id="tB0"><span class="kl">FL</span><b id="pT0">–</b></div>
   <div class="tb na" id="tB1"><span class="kl">FR</span><b id="pT1">–</b></div>
   <div class="tb na" id="tB2"><span class="kl">RL</span><b id="pT2">–</b></div>
   <div class="tb na" id="tB3"><span class="kl">RR</span><b id="pT3">–</b></div>
  </div>
  <div class="lg"><span><i style="border-color:#4d8dff"></i>cold</span><span><i style="border-color:#e6edf5"></i>good</span><span><i style="border-color:#ff3d4d"></i>hot</span></div>
 </section>

 <section class="sec a-fuel">
  <div class="sl">FUEL</div>
  <div class="fg">
   <div class="k" id="kFuel"><div class="kl">LEFT</div><div class="kv kf" id="kFuelV">—</div><div class="kl" id="kFuelS">tap to set tank</div></div>
   <div class="k"><div class="kl">PER LAP</div><div class="kv kf" id="kLapV">—</div><div class="kl" id="kLapS">needs a lap</div></div>
  </div>
 </section>

 <section class="sec a-laps">
  <div class="sl">LAPS</div>
  <div class="k laps"><div id="kLaps"></div></div>
 </section>

 <div class="k a-gg" id="kG">
  <div class="row"><span class="kl" id="kGp">LAT G PEAK</span><span class="kl" id="kCs">over 1g: —</span></div>
  <div class="kb"><i id="kGb"></i><u></u></div>
  <div class="kv kg a" id="kGv">0.00 g</div>
 </div>
</main>

<div class="bar2"><button id="bLine">Set line</button><button id="bCal">Calibrate</button><button id="bExp">Export CSV</button></div>

<div class="menu" id="menu" hidden><div class="sheet">
 <button id="bBle" class="full">Connect ESP32</button>
 <button id="bPh">Phone GPS: off</button>
 <button id="bSim" class="p2">Start simulator</button>
 <button id="bMul">Sim ×1</button>
 <button id="bTank">Set fuel in tank</button>
 <button id="bFuel">Fuel: gal</button>
 <button id="bSpd">Speed: mph</button>
 <button id="bFs">Fullscreen</button>
 <button id="bRst">Reset session</button>
 <button id="bClose" class="full">Close</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const SVC='a1b2c3d4-0001-4000-8000-00805f9b34fb',FAST='a1b2c3d4-0002-4000-8000-00805f9b34fb',SLOW='a1b2c3d4-0003-4000-8000-00805f9b34fb';
/* BLE contract with the ESP32 (all little-endian). Device must advertise service SVC (or a name starting "Z32").
   FAST notify, 26 bytes per record: u32 gpsTimeMs, i32 lat*1e7, i32 lon*1e7, u16 speed 0.01 m/s, u16 heading 0.01 deg, i16 latG mG, i16 lonG mG, u32 fuelMl (cumulative), u16 rpm
     - one notification may hold several whole records; never split a record across notifications
     - send lat=lon=0 (or nothing) while there is no GPS fix; repeated gpsTimeMs values are ignored
   SLOW notify (readable too), 16 bytes: 4x u16 tire 0.1 psi, 4x i16 brake temp C (FL FR RL RR); resend at least every 2 s or the tiles grey out after 5 s */
const S={fuel:'gal',spd:'mph',line:null,pkts:[],laps:[],best:null,cur:null,prev:null,origin:null,last:null,cv:null,con:false,
 slow:{tp:[0,0,0,0],bt:[0,0,0,0]},src:'',srcAt:-1e9,n:0,rate:0,active:null,tank:null,pk:0,pkN:0};
const msg=t=>{S.src=t;S.srcAt=performance.now()};
const fmtT=ms=>{if(ms==null||isNaN(ms))return'–:––.––';const c=Math.round(ms/10),m=Math.floor(c/6000);return m+':'+((c%6000)/100).toFixed(2).padStart(5,'0')};
const toXY=(la,lo)=>{if(!S.origin)S.origin={la,lo};return{x:(lo-S.origin.lo)*Math.cos(S.origin.la*Math.PI/180)*111320,y:(la-S.origin.la)*110540}};
const cross=(a,b)=>a.x*b.y-a.y*b.x,sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});

function feed(p,src){if(S.active!==src){S.active=src;S.prev=null;S.cur=null;S.cv=null;S.con=false}S.gpsT=performance.now();ingest(p)}
function ingest(p){
 const xy=toXY(p.lat,p.lon);p.x=xy.x;p.y=xy.y;S.last=p;S.pkts.push(p);S.n++;
 const sf=performance.now()-(S.slowT||-1e9)<5000;p.tp=sf?S.slow.tp.slice():null;p.bt=sf?S.slow.bt.slice():null;
 if(Math.abs(p.gl)>1){S.cv=p.v;S.con=true}else S.con=false;
 const pr=S.prev;S.prev=p;if(!pr)return;
 const seg=Math.hypot(p.x-pr.x,p.y-pr.y);
 if(S.line){
  const r=sub(p,pr),s=sub(S.line.b,S.line.a),den=cross(r,s);
  if(Math.abs(den)>1e-9){
   const q=sub(S.line.a,pr),t=cross(q,s)/den,u=cross(q,r)/den;
   if(t>=0&&t<1&&u>=0&&u<=1&&r.x*S.line.d.x+r.y*S.line.d.y>0){
    const ct=pr.t+t*(p.t-pr.t),cf=pr.fuel+t*(p.fuel-pr.fuel);
    if(S.cur){
     const ms=ct-S.cur.t0;
     if(ms>8000){const lap={n:S.laps.length+1,ms,fuel:cf-S.cur.f0,t0:S.cur.t0};S.laps.push(lap);if(!S.best||ms<S.best.ms)S.best=lap}
    }
    S.cur={t0:ct,f0:cf};return;
   }
  }
 }
}
function setLine(){
 const p=S.last;if(!p){msg('No position yet, start a source first');return}
 const h=(p.hdg||0)*Math.PI/180,d={x:Math.sin(h),y:Math.cos(h)},n={x:Math.cos(h),y:-Math.sin(h)};
 S.line={a:{x:p.x+n.x*20,y:p.y+n.y*20},b:{x:p.x-n.x*20,y:p.y-n.y*20},d};S.cur=null;S.prev=p;p.ln=1;msg('Start line set');
}
const conv={spd:v=>S.spd==='mph'?v*2.23694:v*3.6};

const GEARS=[3.214,1.925,1.302,1,.752],FD=4.08,CIRC=1.953;
function simRpm(v){let r=1200;for(const g of GEARS){r=v*60*g*FD/CIRC;if(r<=7000)break}return Math.max(1200,Math.min(7300,r))}

/* ---------- Rendering ---------- */
const BT_HOT=650,BT_COLD=250; /* brake temp C: above = hot (red box), below = cold (blue box). tune per car */
const setT=(id,v)=>{const e=$(id);if(e._v!==v){e._v=v;e.textContent=v}};
const setC=(id,c)=>{const e=$(id);if(e._c!==c){e._c=c;e.className=c}};
const fm=(ml,d)=>S.fuel==='gal'?(ml/3785.41).toFixed(d):(ml/1000).toFixed(d);
function fuelLeft(){const p=S.last;if(!S.tank||!p||p.fuel==null)return null;const used=p.fuel-S.tank.f0;return used<0?null:Math.max(0,S.tank.ml-used)}
function setTank(){
 const p=S.last;
 if(!p||p.fuel==null){alert('Needs a live fuel reading from the ESP32 first.');return}
 const v=parseFloat(prompt('Fuel in the tank now ('+S.fuel+')',''));
 if(v>0)S.tank={ml:S.fuel==='gal'?v*3785.41:v*1000,f0:p.fuel};
}
let LAPN=4,lapKey='';
function calcLapN(){
 const box=$('kLaps'),pr=document.createElement('div');pr.className='lr';pr.innerHTML='<span>L1</span><span>0</span><span>0</span>';
 box.appendChild(pr);const rh=pr.offsetHeight||24;box.removeChild(pr);
 const n=Math.max(1,Math.floor(box.clientHeight/rh));if(n!==LAPN){LAPN=n;lapKey=''}
}
function drawLaps(){
 const key=S.laps.length+'|'+(S.best?S.best.n:0)+'|'+LAPN+'|'+(S.line?1:0);
 if(key===lapKey)return;lapKey=key;
 const box=$('kLaps');
 if(!S.laps.length){box.innerHTML='<div class="kl lapnote">'+(S.line?'Waiting for the first lap':'Tap Set line on the start line')+'</div>';return}
 box.innerHTML=S.laps.slice(-LAPN).reverse().map(l=>{const b=S.best&&l.n===S.best.n;
  let right,cls;
  if(b){right='best';cls='g'}else if(l.n===1){right='out lap';cls='dim'}else{right='+'+((l.ms-S.best.ms)/1000).toFixed(2);cls='r'}
  return '<div class="lr"><span class="dim lap">L'+l.n+'</span><span class="'+(b?'g':'')+'">'+fmtT(l.ms)+'</span><span class="'+cls+'">'+right+'</span></div>'}).join('');
}
function render(){
 const p=S.last,now=performance.now();
 const imuOn=!!p&&S.active==='phone'&&IM.ok&&now-IM.t<500;
 let GL=p?p.gl:0;if(imuOn){GL=IM.gl;S.con=Math.abs(GL)>1;if(S.con)S.cv=p.v}
 const live=now-(S.gpsT||-1e9)<3000,hasSlow=now-(S.slowT||-1e9)<5000,hasFuel=live&&!!p&&p.fuel!=null;

 const L=S.laps[S.laps.length-1];
 setT('pLastL',L?'LAST L'+L.n:'LAST LAP');setT('pLast',L?fmtT(L.ms):'–:––.––');
 setT('pBestL',S.best?'BEST L'+S.best.n:'BEST LAP');setT('pBest',S.best?fmtT(S.best.ms):'–:––.––');
 for(let i=0;i<4;i++){const bt=S.slow.bt[i],tp=S.slow.tp[i];
  setT('pT'+i,hasSlow&&tp?tp.toFixed(1):'–');
  setC('tB'+i,'tb '+(!hasSlow||!bt?'na':bt>BT_HOT?'hot':bt<BT_COLD?'cold':'ok'))}
 const fl=S.laps.filter(l=>l.fuel>0).slice(-3),avg=fl.length?fl.reduce((a,l)=>a+l.fuel,0)/fl.length:null,left=fuelLeft();
 setT('kFuelV',left==null?'—':fm(left,1)+' '+S.fuel);
 setT('kFuelS',left==null?(hasFuel?'tap to set tank':'no fuel data'):avg?'about '+(left/avg).toFixed(1)+' laps':'needs a lap');
 setT('kLapV',avg==null?'—':fm(avg,2)+' '+S.fuel);
 setT('kLapS',avg==null?'needs a lap':'avg of '+fl.length);
 if(S.pkN!==S.laps.length){S.pkN=S.laps.length;S.pk=0}
 if(live)S.pk=Math.max(S.pk||0,Math.abs(GL));
 const g=Math.max(-1.5,Math.min(1.5,GL)),w=Math.abs(g)/1.5*50,b=$('kGb');
 b.style.width=w+'%';b.style.left=(g>=0?50:50-w)+'%';b.style.setProperty('--c',Math.abs(GL)>1?'#ffb21f':'#cfd9e6');
 setT('kGv',GL.toFixed(2)+' g');setT('kGp','LAT G PEAK '+(S.pk||0).toFixed(2));
 setT('kCs','over 1g: '+(S.cv==null?'—':Math.round(conv.spd(S.cv))+' '+S.spd));
 $('kG').classList.toggle('flash',!!S.con);$('kG').classList.toggle('off',!live);
 drawLaps();

 /* header */
 let t,c;
 if(S.active==='sim'&&SIM.on&&live){t='Simulator';c='g'}
 else if(S.active==='ble'&&bleOn()&&live){t='ESP32 connected';c='g'}
 else if(S.active==='phone'&&live){t='Phone GPS';c='g'}
 else if(bleOn()){t=BLE.msg||'ESP32 connected';c='a'}
 else if(BLE.want){t=BLE.msg||'Connecting…';c='a'}
 else{t='No source';c='r'}
 setT('stL',t);setC('stL',c);
 const info=(S.rate+' Hz · '+(live?'GPS lock':'no GPS'))+(imuOn?' · IMU':'');
 setT('stR',now-S.srcAt<20000?S.src:info);
 setC('dot','dot'+(live?' live':''));
}
setInterval(render,50);setInterval(()=>{S.rate=S.n-(S._n||0);S._n=S.n},1000);

/* ---------- Simulator ---------- */
const SIM={on:false,mul:1,timer:null,trk:null,s:0,t:0,fuel:0,vp:0,lf:1,tires:[32,32,32,32],bt:[120,120,100,100],j:0};
function buildTrack(){
 const N=700,P=[];
 for(let i=0;i<N;i++){const th=2*Math.PI*i/N,R=210*(1+.28*Math.cos(2*th)+.16*Math.sin(3*th+.6));P.push({x:1.5*R*Math.cos(th),y:R*Math.sin(th)})}
 const cum=[0],H=[],K=[];
 for(let i=0;i<N;i++){const a=P[i],b=P[(i+1)%N];H.push(Math.atan2(b.x-a.x,b.y-a.y));cum.push(cum[i]+Math.hypot(b.x-a.x,b.y-a.y))}
 const wr=x=>{while(x>Math.PI)x-=2*Math.PI;while(x<-Math.PI)x+=2*Math.PI;return x};
 for(let i=0;i<N;i++){const a=H[(i+N-1)%N],b=H[i];K.push(wr(b-a)/(((cum[i+1]-cum[i])+(i>0?cum[i]-cum[i-1]:cum[1]-cum[0]))/2))}
 const Ks=K.map((_,i)=>{let s=0;for(let j=-6;j<=6;j++)s+=K[(i+j+N)%N];return s/13});
 const V=Ks.map(k=>Math.min(58,Math.sqrt(10.8/Math.max(Math.abs(k),1e-4))));
 for(let r=0;r<3;r++){for(let i=N*2;i>=0;i--){const a=i%N,b=(i+1)%N,ds=cum[a+1]-cum[a];V[a]=Math.min(V[a],Math.sqrt(V[b]*V[b]+2*9*ds))}
  for(let i=0;i<N*2;i++){const a=i%N,b=(i+1)%N,ds=cum[a+1]-cum[a];V[b]=Math.min(V[b],Math.sqrt(V[a]*V[a]+2*5*ds))}}
 return{P,cum,H,K:Ks,V,L:cum[N],N};
}
function simStep(dt){
 const T=SIM.trk,N=T.N;let j=SIM.j;
 while(SIM.s>=T.L){SIM.s-=T.L;j=0;SIM.lf=.965+Math.random()*.05}
 while(T.cum[j+1]<=SIM.s)j++;SIM.j=j;
 const f=(SIM.s-T.cum[j])/(T.cum[j+1]-T.cum[j]),a=T.P[j],b=T.P[(j+1)%N];
 const x=a.x+(b.x-a.x)*f,y=a.y+(b.y-a.y)*f,v=(T.V[j]+(T.V[(j+1)%N]-T.V[j])*f)*SIM.lf,k=T.K[j];
 const rpm=simRpm(v);const gl=v*v*k/9.81,gx=(v-SIM.vp)/dt/9.81;SIM.vp=v;SIM.s+=v*dt;SIM.t+=dt*1000;SIM.fuel+=(8+v*.35)*dt;
 for(let i=0;i<4;i++){const fr=i<2?1.3:.7;SIM.bt[i]+=(gx<-.2?-gx*260*fr*dt:0)-(SIM.bt[i]-60)*.03*(1+v/30)*dt;SIM.tires[i]+=(Math.abs(gl)*.02+.0015)*dt-(SIM.tires[i]-32)*.0005*dt}
 const o=S.origin||{la:36.5845,lo:-121.754};
 feed({t:Math.round(SIM.t),lat:o.la+y/110540,lon:o.lo+x/(111320*Math.cos(o.la*Math.PI/180)),v,hdg:(T.H[j]*180/Math.PI+360)%360,gl,gx,fuel:SIM.fuel,rpm},'sim');
}
function simStart(){
 if(!SIM.trk)SIM.trk=buildTrack();
 SIM.s=SIM.trk.L-35;SIM.j=0;SIM.vp=SIM.trk.V[0];
 if(!S.origin)S.origin={la:36.5845,lo:-121.754};
 simStep(.04);setLine();
 SIM.timer=setInterval(()=>{for(let i=0;i<SIM.mul;i++){simStep(.04);if(i%2==0){S.slow={tp:SIM.tires.slice(),bt:SIM.bt.slice()};S.slowT=performance.now()}}},40);
 SIM.on=true;$('bSim').textContent='Stop simulator';wake();
}
function simStop(){clearInterval(SIM.timer);if(S.active==='sim')S.active=null;SIM.on=false;$('bSim').textContent='Start simulator'}

/* ---------- Bluetooth ---------- */
const REC=26;
const BLE={dev:null,fast:null,slow:null,want:false,busy:false,tries:0,timer:null,lastT:null,msg:''};
const bleOn=()=>!!(BLE.dev&&BLE.dev.gatt&&BLE.dev.gatt.connected);
function parseFast(e){
 const d=e.target.value;
 for(let o=0;o+REC<=d.byteLength;o+=REC){
  const t=d.getUint32(o,true),lat=d.getInt32(o+4,true)/1e7,lon=d.getInt32(o+8,true)/1e7,v=d.getUint16(o+12,true)/100;
  if(Math.abs(lat)>90||Math.abs(lon)>180||v>150)continue;
  if(!lat&&!lon){BLE.msg='ESP32 connected, no GPS fix';continue}
  if(BLE.lastT!=null&&t<=BLE.lastT&&BLE.lastT-t<60000)continue;
  BLE.lastT=t;BLE.msg='ESP32 connected';S.bleT=performance.now();
  if(SIM.on)continue;
  feed({t,lat,lon,v,hdg:d.getUint16(o+14,true)/100,gl:d.getInt16(o+16,true)/1000,gx:d.getInt16(o+18,true)/1000,fuel:d.getUint32(o+20,true),rpm:d.getUint16(o+24,true)},'ble');
 }
}
function parseSlow(e){
 const d=e.target.value;if(d.byteLength<16)return;
 S.slowT=performance.now();S.slow={tp:[0,2,4,6].map(i=>d.getUint16(i,true)/10),bt:[8,10,12,14].map(i=>d.getInt16(i,true))};
}
async function bleLink(){
 if(BLE.busy||!BLE.want||bleOn())return;
 BLE.busy=true;clearTimeout(BLE.timer);BLE.timer=null;BLE.tries++;
 BLE.msg=BLE.tries>1?'Reconnecting ('+BLE.tries+')':'Connecting…';
 try{
  const srv=await(await BLE.dev.gatt.connect()).getPrimaryService(SVC);
  BLE.fast=await srv.getCharacteristic(FAST);
  BLE.fast.addEventListener('characteristicvaluechanged',parseFast);
  await BLE.fast.startNotifications();
  try{BLE.slow=await srv.getCharacteristic(SLOW);BLE.slow.addEventListener('characteristicvaluechanged',parseSlow);await BLE.slow.startNotifications();
   try{parseSlow({target:{value:await BLE.slow.readValue()}})}catch(_){}}catch(_){BLE.slow=null}
  if(!BLE.want){try{BLE.dev.gatt.disconnect()}catch(_){}BLE.busy=false;return}
  BLE.tries=0;BLE.msg='ESP32 connected';$('bBle').textContent='Disconnect ESP32';wake();
 }catch(err){
  BLE.msg='BLE: '+(err.message||err);$('bBle').textContent=BLE.tries>1?'Reconnecting…':'Connecting…';
  try{BLE.dev.gatt.disconnect()}catch(_){}
  if(BLE.want)BLE.timer=setTimeout(bleLink,Math.min(5000,1000*BLE.tries));
 }
 BLE.busy=false;
}
function bleDrop(){
 if(!BLE.want)return;
 BLE.msg='Reconnecting…';$('bBle').textContent='Reconnecting…';
 if(!BLE.busy&&!BLE.timer)BLE.timer=setTimeout(bleLink,500);
}
async function connectBle(){
 if(!navigator.bluetooth){alert('Web Bluetooth is not available here. Open this page in Chrome on Android over HTTPS.');return}
 if(BLE.want){
  BLE.want=false;clearTimeout(BLE.timer);BLE.timer=null;
  try{BLE.dev.gatt.disconnect()}catch(_){}
  BLE.msg='';$('bBle').textContent='Connect ESP32';return;
 }
 try{BLE.dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]},{namePrefix:'Z32'}],optionalServices:[SVC]})}
 catch(err){BLE.msg='';msg('BLE: '+(err.message||err));return}
 BLE.dev.addEventListener('gattserverdisconnected',bleDrop);
 BLE.want=true;BLE.tries=0;BLE.lastT=null;$('bBle').textContent='Connecting…';
 bleLink();
}
async function wake(){try{await navigator.wakeLock.request('screen')}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(BLE.want||SIM.on||PH.id!=null))wake()});

/* ---------- Phone IMU (needs calibration) ---------- */
const IM={ok:false,u:null,uc:null,f:null,r:null,gl:0,gx:0,t:0,mode:null,sum:[0,0,0],cnt:0,fw:[0,0,0],fn:0};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],nrm=a=>{const m=Math.hypot(a[0],a[1],a[2])||1;return a.map(x=>x/m)};
function setAxes(u,f){IM.u=u;IM.f=f;IM.r=crs(f,u);IM.ok=true}
try{const c=JSON.parse(localStorage.getItem('z32cal')||'null');if(c)setAxes(c.u,c.f)}catch(_){}
window.addEventListener('devicemotion',e=>{
 const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
 const v=[a.x,a.y,a.z];
 if(IM.mode==='level'){for(let i=0;i<3;i++)IM.sum[i]+=v[i];IM.cnt++;return}
 if(IM.mode==='fwd'){const g=dot(v,IM.uc),h=[v[0]-g*IM.uc[0],v[1]-g*IM.uc[1],v[2]-g*IM.uc[2]];if(Math.hypot(h[0],h[1],h[2])>1.2){for(let i=0;i<3;i++)IM.fw[i]+=h[i];IM.fn++}return}
 if(IM.ok){const g=dot(v,IM.u),h=[v[0]-g*IM.u[0],v[1]-g*IM.u[1],v[2]-g*IM.u[2]];
  IM.gl+=.15*(dot(h,IM.r)/9.81-IM.gl);IM.gx+=.15*(dot(h,IM.f)/9.81-IM.gx);IM.t=performance.now()}
});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function calibrate(){
 try{if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch(_){}
 msg('Cal 1/2: hold still, phone mounted');
 IM.mode='level';IM.sum=[0,0,0];IM.cnt=0;await wait(1500);
 if(IM.cnt<20){IM.mode=null;msg('Cal: no motion data (needs HTTPS + Chrome)');return}
 IM.uc=nrm(IM.sum);IM.fw=[0,0,0];IM.fn=0;IM.mode='fwd';
 msg('Cal 2/2: accelerate straight ahead, gently');
 const t0=performance.now();while(performance.now()-t0<15000&&IM.fn<90)await wait(100);
 IM.mode=null;
 if(IM.fn<90){msg('Cal: not enough straight acceleration, retry');return}
 const f=nrm(IM.fw);setAxes(IM.uc,f);
 try{localStorage.setItem('z32cal',JSON.stringify({u:IM.uc,f}))}catch(_){}
 msg('Cal: done');
}
$('bCal').onclick=calibrate;

/* ---------- Phone GPS fallback ---------- */
const PH={id:null,last:null,gl:0};
const bleFresh=()=>S.bleT&&performance.now()-S.bleT<5000;
function phoneFix(pos){
 if(SIM.on||bleFresh())return;
 const c=pos.coords,t=pos.timestamp,pr=PH.last,k=Math.PI/180;
 let v=c.speed,h=c.heading,gx=0;
 if(pr&&t>pr.t&&t-pr.t<3000){
  const dt=(t-pr.t)/1000,dx=(c.longitude-pr.lon)*Math.cos(c.latitude*k)*111320,dy=(c.latitude-pr.lat)*110540,d=Math.hypot(dx,dy);
  if(v==null)v=d/dt;
  if(h==null||isNaN(h))h=d>1?(Math.atan2(dx,dy)/k+360)%360:pr.hdg;
  gx=(v-pr.v)/dt/9.81;
  const dh=(((h-pr.hdg)%360)+540)%360-180;
  PH.gl=PH.gl*.5+(v>3?v*dh*k/dt/9.81:0)*.5;
 }else PH.gl=0;
 v=v||0;h=(h==null||isNaN(h))?0:h;
 PH.last={t,lat:c.latitude,lon:c.longitude,v,hdg:h};
 const imu=IM.ok&&performance.now()-IM.t<500;
 feed({t,lat:c.latitude,lon:c.longitude,v,hdg:h,gl:imu?IM.gl:PH.gl,gx:imu?IM.gx:gx},'phone');
}
function phoneToggle(){
 if(PH.id!=null){navigator.geolocation.clearWatch(PH.id);PH.id=null;PH.last=null;$('bPh').textContent='Phone GPS: off';return}
 if(!navigator.geolocation){msg('Phone GPS not available here');return}
 PH.id=navigator.geolocation.watchPosition(phoneFix,e=>msg('Phone GPS: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:15000});
 $('bPh').textContent='Phone GPS: on';wake();
}

/* ---------- Export ---------- */
async function exportCsv(){
 const f=(x,d)=>x==null||!Number.isFinite(x)?'':x.toFixed(d),r0=x=>x==null||!Number.isFinite(x)?'':Math.round(x),E=['','','',''];
 const rows=['gps_ms,lat,lon,speed_mps,heading,lat_g,lon_g,fuel_ml,rpm,tp_fl,tp_fr,tp_rl,tp_rr,bt_fl,bt_fr,bt_rl,bt_rr,line_set'].concat(S.pkts.map(p=>[p.t,p.lat.toFixed(7),p.lon.toFixed(7),f(p.v,2),f(p.hdg,1),f(p.gl,3),f(p.gx,3),r0(p.fuel),r0(p.rpm)].concat(p.tp?p.tp.map(x=>x.toFixed(1)):E,p.bt?p.bt.map(r0):E,[p.ln?1:'']).join(',')));
 const lapRows=['','lap,ms,fuel_ml,start_ms'].concat(S.laps.map(l=>[l.n,Math.round(l.ms),r0(l.fuel),Math.round(l.t0)].join(',')));
 const text=rows.concat(lapRows).join('\n'),file=new File([text],'z32-session.csv',{type:'text/csv'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(_){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove()}catch(_){}
 try{await navigator.clipboard.writeText(text);alert('CSV copied to clipboard ('+S.pkts.length+' samples).')}catch(_){}
}

/* ---------- Controls ---------- */
const menu=$('menu'),openMenu=o=>{menu.hidden=!o};
$('bMenu').onclick=()=>openMenu(true);$('bClose').onclick=()=>openMenu(false);
menu.onclick=e=>{if(e.target===menu)openMenu(false)};
$('bLine').onclick=setLine;
$('bExp').onclick=exportCsv;
$('bSim').onclick=()=>{SIM.on?simStop():simStart();openMenu(false)};
$('bMul').onclick=()=>{SIM.mul=SIM.mul===1?2:SIM.mul===2?5:1;$('bMul').textContent='Sim ×'+SIM.mul};
$('bBle').onclick=connectBle;
$('bPh').onclick=phoneToggle;
$('bFuel').onclick=()=>{S.fuel=S.fuel==='gal'?'L':'gal';$('bFuel').textContent='Fuel: '+S.fuel};
$('bSpd').onclick=()=>{S.spd=S.spd==='mph'?'kph':'mph';$('bSpd').textContent='Speed: '+S.spd};
$('bTank').onclick=()=>{openMenu(false);setTank()};$('kFuel').onclick=setTank;
$('bFs').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();return}await document.documentElement.requestFullscreen({navigationUI:'hide'});wake()}catch(err){msg('Fullscreen blocked here, host the page yourself')}openMenu(false)};
$('bRst').onclick=()=>{simStop();Object.assign(S,{line:null,pkts:[],laps:[],best:null,cur:null,prev:null,origin:null,last:null,cv:null,con:false,n:0,pk:0,pkN:0});lapKey='';openMenu(false)};
if(typeof ResizeObserver!=='undefined')new ResizeObserver(calcLapN).observe($('kLaps'));
window.addEventListener('resize',calcLapN);
window.addEventListener('orientationchange',()=>setTimeout(calcLapN,200));
calcLapN();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
